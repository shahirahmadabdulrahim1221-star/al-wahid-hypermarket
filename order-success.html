<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Al Wahid Hyper Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="navbar scrolled" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <div class="brand-logo">AW</div>
        <div class="brand-text"><strong>Al Wahid</strong><span>Hyper Market</span></div>
      </a>
      <div class="nav-actions">
        <button class="icon-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main style="padding-top: 120px;">
    <div class="container" style="max-width: 760px;">
      <div class="success-hero">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h1>Order Confirmed!</h1>
        <p>Thank you for shopping with Al Wahid. We'll deliver your order shortly. You'll receive a call to confirm the address before delivery.</p>
      </div>

      <div style="padding:24px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--card);">
        <h2 style="font-size:18px;margin-bottom:16px;">Order Details</h2>
        <div id="orderDetails"></div>
      </div>

      <div style="margin-top:32px;text-align:center;">
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Continue Shopping</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="margin-top:0;border-top:none;">
      <span>© 2026 Al Wahid Hyper Market. All rights reserved.</span>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="assets/js/script.js"></script>
</body>
</html>
