<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Al Wahid Hyper Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <div class="brand-logo">AW</div>
        <div class="brand-text"><strong>Al Wahid</strong><span>Hyper Market</span></div>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="ourservices.html">Departments</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn cart-btn" id="cartBtn"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" id="cartCount">0</span></button>
        <button class="icon-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <main style="padding-top: 120px;">
    <div class="container">
      <nav style="font-size:13px;color:var(--muted);margin-bottom:24px;">
        <a href="index.html" style="color:var(--muted);">Home</a> / 
        <a href="ourservices.html" style="color:var(--muted);">Shop</a> / 
        <span style="color:var(--fg);">Product</span>
      </nav>

      <div id="productDetail"></div>

      <section style="margin-top:80px;">
        <div class="section-head"><div><span class="eyebrow">You may also like</span><h2 style="font-size:28px;">Related Products</h2></div></div>
        <div class="product-grid" id="relatedGrid"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="margin-top:0;border-top:none;">
      <span>© 2026 Al Wahid Hyper Market. All rights reserved.</span>
    </div>
  </footer>

  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head"><h2><i class="fa-solid fa-bag-shopping"></i> Your Cart</h2><button class="icon-btn" id="cartClose"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot" id="cartFoot"></div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="assets/js/script.js"></script>
</body>
</html>
